    <h1>Changelog</h1>
            <h2>Beta 1 Hotfix</h2>
         <h3>Changes from Beta 1</h3>
          <ul>
		      <li>Fixed the glasses glitching out in Pigini Beach 4.</li>
          <li>Fixed the starlimits in Chrome Dimension 1 to 9.</li>
         </ul>
                   <p> <p>
            <h2>Beta 1</h2>
         <h3>Changes from 7.3.0</h3>
          <ul>
          <li>Removed the Mighty League completely, including it's banners and pop-ups in normal gameplay.</li>
          <li>Replaced the Mighty League era splash screen with the the original 2012 splash screen.</li>
          <li>Replaced the newer 2015 logo with the classic one.</li>
          <li>Added the last part of Piggy Farm.</li>
          <li>Added all of Jurassic Pork.</li>
          <li>Added Daily Rewards, originally from the Premium version.</li>
          <li>Restored the older episode order from versions 7.1.0 and earlier, replacing the newer one.</li>
          <li>Replaced the Mighty League era splash screen with the the original 2012 splash screen.</li>
          <li>Replaced the newer 2015 logo with the classic one.</li>
          <li>Added Pigini Beach and Pig Tales from the Flash version of Angry Birds Friends.</li>
          <li>Added Chrome Dimension and Teamwork from Angry Birds Chrome and Angry Birds Google+ respectively</li>
          <li>Added Moon Fest from the chinese version of Angry Birds Classic.</li>
          <li>Added the Red's Mighty Feathers powerup and it's respective golden egg.</li>
          <li>Restored the button click effect from versions 7.0.0 and earlier.</li>
          <li>Restored the older shop design seen in versions 5.0.1 and earlier.</li>
          <li>Restored the older buttons from versions 4.1.0 and earlier.</li>
          <li>Fixed various clipping and other minor issues with select backgrounds.</li>
          <li>Fixed the pivot points for some Pigs and Birds to make them fit in place.</li>
          <li>Restored the Bird and Pig decorations in the level selection menus.</li>
          <li>Restored the version 5.0.1 level layouts for most episodes.</li>
          <li>Restored the version 7.0.0 and earlier sound effects.</li>
          <li>Fixed the results screen not displaying the 3 Star text when an episode is 100% done.</li>
          <li>Restored the Matilda Ability Sprite.</li>
          <li>Removed the Angry Birds 2 and Angry Birds Friends ads in all of the game.</li>
          <li>Restored a unused frame for Shockwave Bomb.</li>
          <li>Remade the Piggy Farm and Jurassic Pork cutscenes to fit better with the rest of the game.</li>
          <li>Made Mighty Eagle unlocked from the start.</li>
          <li>Made the camera more zoomed out for ultra wide devices.</li>
          <li>Added 6 new Golden Eggs.</li>
          <li>Fixed the level results crashing in the King Pig Golden Egg.</li>
          <li>Fixed a crash in the first level of Red's Mighty Feathers.</li>
          <li>Added new Golden Eggs to replace the Mighty League ones (which are now removed).</li>
          <li>Remade the Episode buttons for Poached Eggs, Mighty Hoax, Danger Above, Piggy Farm and Jurassic Pork.</li>
         </ul>
